<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Clay & Hearth | Handcrafted Ceramics</title>
    <meta name="description" content="Discover unique handcrafted ceramic tableware from North American artisans. Browse collections, meet makers, visualize pieces with AR, and commission custom items for your home.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fefaf5;
            color: #2c241a;
            line-height: 1.5;
        }

        h1, h2, h3, h4, .logo, .nav-links a, .btn, .card-title {
            font-family: 'Playfair Display', serif;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            flex-wrap: wrap;
            background: #fffaf5;
            border-bottom: 1px solid #f0e4d8;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #9b6a4b;
            cursor: pointer;
        }
        .logo span {
            color: #c18f5b;
            font-weight: 400;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-links a {
            text-decoration: none;
            font-weight: 500;
            color: #4a3729;
            transition: 0.2s;
            cursor: pointer;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #b87c4f;
            border-bottom: 2px solid #b87c4f;
        }
        .cart-icon {
            position: relative;
            font-size: 1.3rem;
            cursor: pointer;
        }
        .cart-count {
            position: absolute;
            top: -8px;
            right: -12px;
            background: #b87c4f;
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 50%;
            font-family: 'Inter', sans-serif;
        }
        
        .hero {
            text-align: center;
            padding: 4rem 2rem 5rem;
            background: linear-gradient(145deg, #f9efE8 0%, #fff4ec 100%);
        }
        .hero h1 {
            font-size: 3.5rem;
            font-weight: 600;
            color: #4f2d1a;
            margin-bottom: 1rem;
        }
        .hero p {
            font-size: 1.2rem;
            max-width: 650px;
            margin: 0 auto 2rem;
            color: #5e3e2b;
        }
        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary {
            background: #b87c4f;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .btn-primary:hover {
            background: #9e623b;
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #b87c4f;
            color: #b87c4f;
        }
        .btn-outline:hover {
            background: #b87c4f20;
        }

        .page-content {
            min-height: 60vh;
            padding: 2rem 0;
        }
        
        .section {
            padding: 2rem 0;
        }
        .section-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 500;
            margin-bottom: 2rem;
            color: #4d3222;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }
        .card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            transition: all 0.3s ease;
            border: 1px solid #f5e7dd;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 30px -12px rgba(0,0,0,0.1);
        }
        .card-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: #ede3d9;
        }
        .card-content {
            padding: 1.5rem;
        }
        .card-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .price {
            font-weight: 700;
            color: #b87c4f;
            font-size: 1.2rem;
            margin: 0.5rem 0;
        }
        .maker {
            font-size: 0.85rem;
            color: #8e6e58;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.5rem;
        }

        .makers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            text-align: center;
        }
        .maker-card {
            background: white;
            border-radius: 32px;
            padding: 1.5rem;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .maker-card:hover {
            transform: translateY(-4px);
        }
        .maker-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1rem;
            border: 3px solid #e9cfbb;
        }

        .ar-badge {
            background: #ecd9cc;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
            color: #b87c4f;
        }
        
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .close-modal {
            cursor: pointer;
            font-size: 1.8rem;
            color: #999;
        }
        .close-modal:hover {
            color: #333;
        }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 1rem 0;
            border-bottom: 1px solid #f0e4d8;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e0d4c8;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
        }
        
        .footer {
            background: #2c241a;
            color: #e9dbcf;
            padding: 3rem 2rem;
            text-align: center;
            margin-top: 2rem;
        }
        .footer a {
            color: #e0bc9c;
            text-decoration: none;
            cursor: pointer;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 700px) {
            .navbar {
                flex-direction: column;
                gap: 1rem;
            }
            .hero h1 {
                font-size: 2.2rem;
            }
            .container {
                padding: 0 1rem;
            }
            .nav-links {
                justify-content: center;
            }
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c241a;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            z-index: 1000;
            animation: fadeInUp 0.3s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        .checkout-form {
            background: #f9f5f0;
            padding: 1.5rem;
            border-radius: 20px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo" data-page="home">Clay & <span>Hearth</span></div>
        <div class="nav-links">
            <a data-page="home" class="active">Home</a>
            <a data-page="collections">Collections</a>
            <a data-page="artisans">Artisans</a>
            <a data-page="custom">Custom</a>
            <a data-page="ar">AR View</a>
            <a class="cart-icon" id="cart-icon">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-count" id="cart-count">0</span>
            </a>
        </div>
    </nav>

    <div id="app">
        <!-- Dynamic content will load here -->
    </div>

    <footer class="footer">
        <p>© 2025 Clay & Hearth — supporting North American ceramic artists</p>
        <p style="margin-top: 0.7rem;">
            <a data-page="about">About</a> | 
            <a data-page="sustainability">Sustainability</a> | 
            <a data-page="contact">Contact</a>
        </p>
    </footer>

    <!-- Product Detail Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-product-title"></h2>
                <span class="close-modal" onclick="closeProductModal()">&times;</span>
            </div>
            <div id="modal-product-details"></div>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Your Cart</h2>
                <span class="close-modal" onclick="closeCartModal()">&times;</span>
            </div>
            <div id="cart-items"></div>
            <div id="cart-total" style="margin-top: 1rem; font-weight: bold;"></div>
            <button class="btn btn-primary" id="checkout-btn" style="margin-top: 1rem; width: 100%;">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Checkout</h2>
                <span class="close-modal" onclick="closeCheckoutModal()">&times;</span>
            </div>
            <div class="checkout-form">
                <form id="checkout-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="full-name" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="address" required>
                    </div>
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="city" required>
                    </div>
                    <div class="form-group">
                        <label>ZIP Code</label>
                        <input type="text" id="zip" required>
                    </div>
                    <div class="form-group">
                        <label>Payment Method</label>
                        <select id="payment-method">
                            <option value="credit-card">Credit Card</option>
                            <option value="paypal">PayPal</option>
                            <option value="apple-pay">Apple Pay</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Place Order</button>
                </form>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    
    <script>
        // Global variables
        let currentMakerProducts = [];
        
        // Shopping cart state
        let cart = JSON.parse(localStorage.getItem('clayCart') || '[]');
        
        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            const cartCountEl = document.getElementById('cart-count');
            if (cartCountEl) cartCountEl.textContent = count;
            localStorage.setItem('clayCart', JSON.stringify(cart));
        }
        
        function addToCart(productId) {
            const product = window.CONFIG?.getProductById(productId);
            if (!product) return;
            
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ id: productId, quantity: 1, name: product.name, price: product.price });
            }
            updateCartCount();
            showToast(`Added ${product.name} to cart! 🛒`);
        }
        
        function showToast(message) {
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function showProductDetails(productId) {
            const product = window.CONFIG?.getProductById(productId);
            if (!product) return;
            
            document.getElementById('modal-product-title').textContent = product.name;
            document.getElementById('modal-product-details').innerHTML = `
                <img src="${product.images[0]}" alt="${product.name}" style="width: 100%; border-radius: 16px; margin-bottom: 1rem;">
                <p><strong>Price:</strong> $${product.price}</p>
                <p><strong>Maker:</strong> ${product.maker}</p>
                <p><strong>Location:</strong> ${product.location}</p>
                <p><strong>Description:</strong> ${product.description}</p>
                <p><strong>Materials:</strong> ${product.material}</p>
                <p><strong>Dimensions:</strong> ${product.dimensions}</p>
                <p><strong>Care:</strong> ${product.care}</p>
                ${product.arEnabled ? '<p><span class="ar-badge"><i class="fas fa-vr-cardboard"></i> AR Compatible</span></p>' : ''}
                <button class="btn btn-primary" style="margin-top: 1rem; width: 100%;" onclick="addToCart(${product.id}); closeProductModal();">Add to Cart</button>
            `;
            document.getElementById('product-modal').style.display = 'flex';
        }
        
        function showMakerCollection(makerId) {
            const maker = window.CONFIG?.getMakerById(makerId);
            const products = window.CONFIG?.getProductsByMaker(makerId);
            currentMakerProducts = products;
            
            document.getElementById('modal-product-title').textContent = `${maker.name}'s Collection`;
            document.getElementById('modal-product-details').innerHTML = `
                <div class="grid" style="grid-template-columns: 1fr 1fr;">
                    ${products.map(product => `
                        <div class="card" style="cursor: pointer;" onclick="showProductDetails(${product.id})">
                            <img class="card-img" src="${product.images[0]}" alt="${product.name}" style="height: 150px;">
                            <div class="card-content">
                                <div class="card-title" style="font-size: 1rem;">${product.name}</div>
                                <div class="price">$${product.price}</div>
                                <button class="btn btn-primary" style="padding: 0.3rem 0.8rem; font-size: 0.8rem;" onclick="event.stopPropagation(); addToCart(${product.id})">Add to Cart</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('product-modal').style.display = 'flex';
        }
        
        function openProductModal() {
            // Kept for compatibility
        }
        
        function closeProductModal() {
            document.getElementById('product-modal').style.display = 'none';
        }
        
        function closeCartModal() {
            document.getElementById('cart-modal').style.display = 'none';
        }
        
        function closeCheckoutModal() {
            document.getElementById('checkout-modal').style.display = 'none';
        }
        
        function renderCartModal() {
            const cartItemsDiv = document.getElementById('cart-items');
            const cartTotalDiv = document.getElementById('cart-total');
            
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p style="text-align: center; padding: 2rem;">Your cart is empty.</p>';
                cartTotalDiv.innerHTML = '';
                return;
            }
            
            let total = 0;
            cartItemsDiv.innerHTML = cart.map(item => {
                const product = window.CONFIG?.getProductById(item.id);
                if (!product) return '';
                const itemTotal = product.price * item.quantity;
                total += itemTotal;
                return `
                    <div class="cart-item">
                        <div>
                            <strong>${product.name}</strong><br>
                            $${product.price} each
                        </div>
                        <div>
                            <button class="cart-qty-btn" data-id="${item.id}" data-change="-1" style="padding: 0.3rem 0.6rem; border: 1px solid #ddd; background: white; border-radius: 8px; cursor: pointer;">-</button>
                            <span style="margin: 0 10px;">${item.quantity}</span>
                            <button class="cart-qty-btn" data-id="${item.id}" data-change="1" style="padding: 0.3rem 0.6rem; border: 1px solid #ddd; background: white; border-radius: 8px; cursor: pointer;">+</button>
                            <button class="cart-remove-btn" data-id="${item.id}" style="margin-left: 10px; background: none; border: none; color: #b87c4f; cursor: pointer; font-size: 1.2rem;">✕</button>
                        </div>
                    </div>
                `;
            }).join('');
            
            const shipping = total > 75 ? 0 : 7.99;
            const tax = total * 0.08;
            const grandTotal = total + shipping + tax;
            
            cartTotalDiv.innerHTML = `
                <div style="margin-top: 1rem;">
                    <p><strong>Subtotal:</strong> $${total.toFixed(2)}</p>
                    <p><strong>Shipping:</strong> ${shipping === 0 ? 'FREE' : '$' + shipping.toFixed(2)}</p>
                    <p><strong>Tax (8%):</strong> $${tax.toFixed(2)}</p>
                    <hr style="margin: 0.5rem 0;">
                    <p style="font-size: 1.2rem;"><strong>Total:</strong> $${grandTotal.toFixed(2)}</p>
                </div>
            `;
            
            // Add event listeners for cart buttons
            document.querySelectorAll('.cart-qty-btn').forEach(btn => {
                btn.removeEventListener('click', handleCartQty);
                btn.addEventListener('click', handleCartQty);
            });
            
            document.querySelectorAll('.cart-remove-btn').forEach(btn => {
                btn.removeEventListener('click', handleCartRemove);
                btn.addEventListener('click', handleCartRemove);
            });
        }
        
        function handleCartQty(e) {
            const id = parseInt(e.target.dataset.id);
            const change = parseInt(e.target.dataset.change);
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
                updateCartCount();
                renderCartModal();
            }
        }
        
        function handleCartRemove(e) {
            const id = parseInt(e.target.dataset.id);
            cart = cart.filter(i => i.id !== id);
            updateCartCount();
            renderCartModal();
        }
        
        // Expanded Artisans (12 artisans)
        const expandedMakers = [
            { id: 1, name: "Elena Wolf", location: "Portland, OR", specialty: "Wood-fired stoneware", experience: "15 years", avatar: "https://randomuser.me/api/portraits/women/68.jpg", story: "Elena discovered pottery while studying environmental science. She now runs a solar-powered studio." },
            { id: 2, name: "James Rivera", location: "Burlington, VT", specialty: "Glaze alchemy", experience: "22 years", avatar: "https://randomuser.me/api/portraits/men/32.jpg", story: "Former chemist turned potter, known for crystalline glazes." },
            { id: 3, name: "Maya Chen", location: "Vancouver, BC", specialty: "Minimalist slipware", experience: "8 years", avatar: "https://randomuser.me/api/portraits/women/44.jpg", story: "Blends traditional Chinese techniques with West Coast minimalism." },
            { id: 4, name: "Sam Greywolf", location: "Santa Fe, NM", specialty: "Native inspired textures", experience: "30 years", avatar: "https://randomuser.me/api/portraits/men/52.jpg", story: "Cherokee descent, pieces in Heard Museum permanent collection." },
            { id: 5, name: "Patricia Okafor", location: "Atlanta, GA", specialty: "Afrocentric patterns", experience: "12 years", avatar: "https://randomuser.me/api/portraits/women/89.jpg", story: "Celebrates African heritage through contemporary ceramic forms." },
            { id: 6, name: "David Kim", location: "Los Angeles, CA", specialty: "Porcelain minimalism", experience: "18 years", avatar: "https://randomuser.me/api/portraits/men/45.jpg", story: "Zen-inspired pieces with perfect white porcelain." },
            { id: 7, name: "Sophie Martin", location: "Montreal, QC", specialty: "Textured stoneware", experience: "10 years", avatar: "https://randomuser.me/api/portraits/women/23.jpg", story: "Creates pieces that feel like smooth river stones." },
            { id: 8, name: "Carlos Mendez", location: "Austin, TX", specialty: "Colorful maiolica", experience: "14 years", avatar: "https://randomuser.me/api/portraits/men/67.jpg", story: "Bright, hand-painted Italian-inspired ceramics." },
            { id: 9, name: "Yuki Tanaka", location: "Seattle, WA", specialty: "Raku firing", experience: "20 years", avatar: "https://randomuser.me/api/portraits/women/56.jpg", story: "Master of the dramatic raku firing process." },
            { id: 10, name: "Marcus Williams", location: "Chicago, IL", specialty: "Sculptural vessels", experience: "9 years", avatar: "https://randomuser.me/api/portraits/men/91.jpg", story: "Functional art that doubles as sculpture." },
            { id: 11, name: "Emma Thompson", location: "Boston, MA", specialty: "Nerikomi", experience: "11 years", avatar: "https://randomuser.me/api/portraits/women/17.jpg", story: "Japanese marbling technique with colored clays." },
            { id: 12, name: "Luis Fernandez", location: "Miami, FL", specialty: "Caribbean inspired", experience: "7 years", avatar: "https://randomuser.me/api/portraits/men/33.jpg", story: "Bright colors and tropical patterns." }
        ];
        
        // Page content renderers
        const pages = {
            home: function() {
                return `
                    <section class="hero">
                        <div class="container">
                            <h1>Earth. Fire. Craft.</h1>
                            <p>Discover unique handcrafted ceramic tableware from North American artisans. Visualize pieces with AR, and commission custom items for your home.</p>
                            <div class="btn-group">
                                <button class="btn btn-primary" data-page="collections">Shop Now</button>
                                <button class="btn btn-outline" data-page="ar">Explore in AR</button>
                            </div>
                        </div>
                    </section>
                    
                    <section class="section">
                        <div class="container">
                            <h2 class="section-title">Featured Collections</h2>
                            <div class="grid" id="featured-grid">
                                ${renderProductGrid(window.CONFIG?.getFeaturedProducts() || [])}
                            </div>
                        </div>
                    </section>
                    
                    <section class="section" style="background: #fff6ef;">
                        <div class="container">
                            <h2 class="section-title">Meet Our Artisans</h2>
                            <div class="makers-grid">
                                ${renderMakersGrid(expandedMakers.slice(0, 6))}
                            </div>
                        </div>
                    </section>
                    
                    <section class="section">
                        <div class="container" style="text-align: center; background: #e7d9cf; border-radius: 48px; padding: 3rem 2rem;">
                            <h2 style="font-size: 1.9rem;">See it in your space</h2>
                            <p style="max-width: 600px; margin: 1rem auto;">Point your camera to preview any mug or bowl in augmented reality before you buy.</p>
                            <button class="btn btn-primary" style="background:#4f2d1a;" data-page="ar"><i class="fas fa-cube"></i> Try AR view</button>
                            <div style="margin-top: 1rem;"><button class="btn-outline btn" data-page="custom">Commission a custom piece →</button></div>
                        </div>
                    </section>
                `;
            },
            
            collections: function() {
                return `
                    <div class="container">
                        <h1 class="section-title">All Collections</h1>
                        <div class="grid">
                            ${renderProductGrid(window.CONFIG?.products || [])}
                        </div>
                    </div>
                `;
            },
            
            artisans: function() {
                return `
                    <div class="container">
                        <h1 class="section-title">Our Artisans</h1>
                        <div class="makers-grid">
                            ${renderMakersGrid(expandedMakers)}
                        </div>
                    </div>
                `;
            },
            
            custom: function() {
                return `
                    <div class="container">
                        <div style="max-width: 800px; margin: 0 auto; padding: 2rem;">
                            <h1 class="section-title">Commission Custom Ceramics</h1>
                            <div style="background: white; border-radius: 24px; padding: 2rem; margin-top: 2rem;">
                                <p style="font-size: 1.1rem; margin-bottom: 1rem;">Work directly with our artisans to create something uniquely yours.</p>
                                <h3>Process:</h3>
                                <ul style="margin: 1rem 0 1rem 2rem;">
                                    <li>Initial consultation (virtual or in-studio)</li>
                                    <li>Design concept & sketch</li>
                                    <li>Client approval</li>
                                    <li>Creation & firing</li>
                                    <li>Final approval</li>
                                    <li>Shipping or pickup</li>
                                </ul>
                                <p><strong>Timeline:</strong> 4-16 weeks depending on complexity</p>
                                <p><strong>Starting budget:</strong> $150+</p>
                                <button class="btn btn-primary" style="margin-top: 2rem; width: 100%;" id="start-custom">Start Your Commission →</button>
                            </div>
                        </div>
                    </div>
                `;
            },
            
            ar: function() {
                const arProducts = window.CONFIG?.getARProducts() || [];
                return `
                    <div class="container">
                        <h1 class="section-title">AR-Enabled Pieces</h1>
                        <p style="text-align: center; margin-bottom: 2rem;">View these pieces in your own space using augmented reality</p>
                        <div class="grid">
                            ${renderProductGrid(arProducts)}
                        </div>
                        <div style="text-align: center; margin-top: 3rem; padding: 2rem; background: #e7d9cf; border-radius: 24px;">
                            <i class="fas fa-vr-cardboard" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                            <h3>How to use AR</h3>
                            <p>1. Click "View in AR" on any AR-enabled piece<br>
                            2. Allow camera access when prompted<br>
                            3. Point your camera at a flat surface<br>
                            4. Place and scale the ceramic piece in your space</p>
                        </div>
                    </div>
                `;
            },
            
            about: function() {
                return `
                    <div class="container">
                        <div style="max-width: 800px; margin: 0 auto; padding: 2rem;">
                            <h1 class="section-title">About Clay & Hearth</h1>
                            <div style="background: white; border-radius: 24px; padding: 2rem;">
                                <p style="font-size: 1.1rem; margin-bottom: 1rem;">Founded in 2020, Clay & Hearth connects discerning home cooks and collectors with North America's finest ceramic artists.</p>
                                <p style="margin-bottom: 1rem;">Our mission is to preserve traditional pottery techniques while embracing modern technology like augmented reality to help you discover the perfect piece for your home.</p>
                                <h3>Our Values</h3>
                                <ul style="margin: 1rem 0 1rem 2rem;">
                                    <li>Support living wage for artists</li>
                                    <li>Sustainable materials and practices</li>
                                    <li>Carbon-neutral shipping</li>
                                    <li>Community workshops and education</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                `;
            },
            
            sustainability: function() {
                return `
                    <div class="container">
                        <div style="max-width: 800px; margin: 0 auto; padding: 2rem;">
                            <h1 class="section-title">Sustainability</h1>
                            <div style="background: white; border-radius: 24px; padding: 2rem;">
                                <p>We're committed to environmentally responsible practices:</p>
                                <ul style="margin: 1rem 0 1rem 2rem;">
                                    <li>All packaging is 100% recyclable or compostable</li>
                                    <li>Partners with local clay sources to reduce transport emissions</li>
                                    <li>Studio kilns powered by renewable energy</li>
                                    <li>Glaze recycling program to minimize waste</li>
                                    <li>Tree planted for every purchase over $100</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                `;
            },
            
            contact: function() {
                return `
                    <div class="container">
                        <div style="max-width: 600px; margin: 0 auto; padding: 2rem;">
                            <h1 class="section-title">Contact Us</h1>
                            <div style="background: white; border-radius: 24px; padding: 2rem;">
                                <p><i class="fas fa-envelope"></i> <strong>Email:</strong> hello@clayandhearth.com</p>
                                <p><i class="fas fa-phone"></i> <strong>Phone:</strong> +1 (555) 823-4567</p>
                                <p><i class="fas fa-map-marker-alt"></i> <strong>Studio:</strong> Portland, Oregon · Santa Fe, New Mexico</p>
                                <hr style="margin: 1rem 0;">
                                <p><strong>Studio Hours:</strong><br>
                                Monday - Friday: 10am - 6pm<br>
                                Saturday: 11am - 4pm<br>
                                Sunday: Closed</p>
                            </div>
                        </div>
                    </div>
                `;
            }
        };
        
        function renderProductGrid(products) {
            if (!products || products.length === 0) {
                return '<div class="loading">No products found.</div>';
            }
            
            return products.map(product => `
                <div class="card">
                    <img class="card-img" src="${product.images[0]}" alt="${product.name}" loading="lazy" onerror="this.src='https://placehold.co/400x400?text=Ceramic+Art'">
                    <div class="card-content">
                        <div class="card-title">${product.name}</div>
                        <div class="price">$${product.price}</div>
                        <div class="maker"><i class="fas fa-palette"></i> ${product.maker}</div>
                        ${product.arEnabled ? '<div class="ar-badge"><i class="fas fa-vr-cardboard"></i> AR compatible</div>' : ''}
                        <div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                            <button class="btn-outline btn view-product" style="padding: 0.4rem 1rem; font-size:0.8rem;" data-id="${product.id}">View Details</button>
                            <button class="btn-primary btn add-to-cart" style="padding: 0.4rem 1rem; font-size:0.8rem;" data-id="${product.id}">Add to Cart</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function renderMakersGrid(makers) {
            if (!makers || makers.length === 0) {
                return '<div class="loading">No makers found.</div>';
            }
            
            return makers.map(maker => `
                <div class="maker-card">
                    <img class="maker-avatar" src="${maker.avatar}" alt="${maker.name}" onerror="this.src='https://placehold.co/120x120'">
                    <h3 style="font-weight:600;">${maker.name}</h3>
                    <p><i class="fas fa-map-marker-alt"></i> ${maker.location}</p>
                    <p style="font-size:0.85rem;">${maker.specialty}</p>
                    <p style="font-size:0.75rem; margin-top: 0.5rem; color: #b87c4f;">${maker.experience}</p>
                    <button class="view-maker" style="margin-top: 0.8rem; background: none; border: none; color: #b87c4f; cursor: pointer;" data-id="${maker.id}">See collection →</button>
                </div>
            `).join('');
        }
        
        // Load a page
        function loadPage(pageName) {
            const renderer = pages[pageName];
            if (renderer) {
                document.getElementById('app').innerHTML = renderer();
                
                // Update active nav state
                document.querySelectorAll('[data-page]').forEach(el => {
                    if (el.dataset.page === pageName) {
                        el.classList.add('active');
                    } else if (el.classList) {
                        el.classList.remove('active');
                    }
                });
                
                // Re-attach event listeners for dynamic content
                attachDynamicListeners();
                
                // Scroll to top
                window.scrollTo(0, 0);
            }
        }
        
        function attachDynamicListeners() {
            // Navigation links
            document.querySelectorAll('[data-page]').forEach(el => {
                el.removeEventListener('click', handleNavClick);
                el.addEventListener('click', handleNavClick);
            });
            
            // Add to cart buttons
            document.querySelectorAll('.add-to-cart').forEach(btn => {
                btn.removeEventListener('click', handleAddToCart);
                btn.addEventListener('click', handleAddToCart);
            });
            
            // View product buttons
            document.querySelectorAll('.view-product').forEach(btn => {
                btn.removeEventListener('click', handleViewProduct);
                btn.addEventListener('click', handleViewProduct);
            });
            
            // View maker buttons
            document.querySelectorAll('.view-maker').forEach(btn => {
                btn.removeEventListener('click', handleViewMaker);
                btn.addEventListener('click', handleViewMaker);
            });
            
            // Custom commission button
            const customBtn = document.getElementById('start-custom');
            if (customBtn) {
                customBtn.removeEventListener('click', handleCustomCommission);
                customBtn.addEventListener('click', handleCustomCommission);
            }
        }
        
        function handleNavClick(e) {
            const page = e.currentTarget.dataset.page;
            if (page) {
                e.preventDefault();
                loadPage(page);
            }
        }
        
        function handleAddToCart(e) {
            e.stopPropagation();
            const id = parseInt(e.currentTarget.dataset.id);
            addToCart(id);
        }
        
        function handleViewProduct(e) {
            e.stopPropagation();
            const id = parseInt(e.currentTarget.dataset.id);
            showProductDetails(id);
        }
        
        function handleViewMaker(e) {
            e.stopPropagation();
            const id = parseInt(e.currentTarget.dataset.id);
            showMakerCollection(id);
        }
        
        function handleCustomCommission(e) {
            e.preventDefault();
            showToast('📋 Custom commission request sent! An artisan will contact you within 48 hours.');
            setTimeout(() => {
                showToast('✨ Check your email for next steps!');
            }, 2000);
        }
        
        // Make functions global for modal buttons
        window.addToCart = addToCart;
        window.showProductDetails = showProductDetails;
        window.closeProductModal = closeProductModal;
        window.closeCartModal = closeCartModal;
        window.closeCheckoutModal = closeCheckoutModal;
        
        // Cart modal handlers
        const cartIcon = document.getElementById('cart-icon');
        const cartModal = document.getElementById('cart-modal');
        const checkoutModal = document.getElementById('checkout-modal');
        const checkoutBtn = document.getElementById('checkout-btn');
        
        cartIcon.addEventListener('click', () => {
            renderCartModal();
            cartModal.style.display = 'flex';
        });
        
        if (checkoutBtn) {
            checkoutBtn.addEventListener('click', () => {
                if (cart.length === 0) {
                    showToast('Your cart is empty!');
                } else {
                    cartModal.style.display = 'none';
                    checkoutModal.style.display = 'flex';
                }
            });
        }
        
        // Checkout form submission
        const checkoutForm = document.getElementById('checkout-form');
        if (checkoutForm) {
            checkoutForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('full-name')?.value;
                if (name) {
                    showToast(`🎉 Thank you ${name}! Your order has been placed.`);
                    cart = [];
                    updateCartCount();
                    checkoutModal.style.display = 'none';
                    loadPage('home');
                }
            });
        }
        
        // Close modals when clicking outside
        window.addEventListener('click', (e) => {
            if (e.target === cartModal) cartModal.style.display = 'none';
            if (e.target === checkoutModal) checkoutModal.style.display = 'none';
            if (e.target === document.getElementById('product-modal')) closeProductModal();
        });
        
        // Load home page by default
        if (window.CONFIG) {
            // Merge expanded makers with config
            window.CONFIG.makers = expandedMakers;
            // Add helper for maker products
            window.CONFIG.getProductsByMaker = function(makerId) {
                return this.products.filter(p => p.makerId === makerId);
            };
        }
        
        loadPage('home');
        updateCartCount();
        
        console.log('✨ Clay & Hearth fully loaded with all features!');
    </script>
</body>
</html>
